[project]
name = "payments-api"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]   # Depends()/Header() в значениях по умолчанию — штатный приём FastAPI

[tool.ruff.lint.isort]
known-third-party = ["alembic"]   # рядом лежит папка миграций alembic/ — без этого ruff считает пакет своим
